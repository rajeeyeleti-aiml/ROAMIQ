<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ROAMIQ</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background: #eef7ee;
            padding: 30px 15px;
        }

        .container {
            max-width: 600px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        }

        h1 {
            font-size: 42px;
            margin-bottom: 5px;
        }

        .tagline {
            font-size: 18px;
            color: #555;
            margin-bottom: 30px;
        }

        button {
            padding: 14px 24px;
            margin: 8px;
            font-size: 17px;
            border: none;
            border-radius: 30px;
            cursor: pointer;
        }

        .start-btn {
            background: #222;
            color: white;
        }

        .camera-btn {
            background: #e8f5e9;
        }

        .verify-btn {
            background: #dcedc8;
        }

        #challenge {
            margin-top: 25px;
            padding: 20px;
            background: #f1f8e9;
            border-radius: 15px;
            font-size: 21px;
            line-height: 1.5;
        }

        #status {
            margin-top: 15px;
            color: #666;
        }

        #preview {
            max-width: 100%;
            margin-top: 20px;
            border-radius: 15px;
            display: none;
        }

        #verifyMessage {
            margin-top: 15px;
            font-weight: bold;
        }

        input {
            display: none;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>🌿 ROAMIQ</h1>

        <p class="tagline">
            AI that gets you moving.
        </p>

        <!-- Start ROAMIQ -->
        <button class="start-btn" onclick="startRoamiq()">
            🎙️ Start ROAMIQ
        </button>

        <!-- Challenge -->
        <div id="challenge">
            Your outdoor challenge will appear here.
        </div>

        <div id="status"></div>

        <!-- Camera -->
        <div style="margin-top: 25px;">

            <label for="photoInput">
                <span class="camera-btn"
                      style="display:inline-block;
                             padding:14px 24px;
                             border-radius:30px;
                             cursor:pointer;
                             font-size:17px;">
                    📷 Take Photo
                </span>
            </label>

            <input
                id="photoInput"
                type="file"
                accept="image/*"
                capture="environment"
                onchange="showPhoto(event)"
            >

        </div>

        <!-- Photo Preview -->
        <img id="preview" alt="Your discovery">

        <!-- Verification -->
        <button
            class="verify-btn"
            onclick="verifyDiscovery()">
            🤖 Verify Discovery
        </button>

        <div id="verifyMessage"></div>

    </div>


    <script>

        // Get a new AI challenge
        async function startRoamiq() {

            document.getElementById("status").innerText =
                "🤖 Creating your challenge...";

            try {

                const response = await fetch("/challenge");

                const data = await response.json();

                const challenge = data.challenge;

                document.getElementById("challenge").innerText =
                    challenge;

                document.getElementById("status").innerText =
                    "🎧 Listen and explore your surroundings!";

                speak(challenge);

            } catch (error) {

                document.getElementById("status").innerText =
                    "Something went wrong. Please try again.";

                console.error(error);
            }
        }


        // AI speaks the challenge
        function speak(text) {

            const speech =
                new SpeechSynthesisUtterance(text);

            speech.lang = "en-US";

            speech.rate = 0.9;

            window.speechSynthesis.cancel();

            window.speechSynthesis.speak(speech);
        }


        // Show captured photo
        function showPhoto(event) {

            const file =
                event.target.files[0];

            if (!file) {
                return;
            }

            const preview =
                document.getElementById("preview");

            preview.src =
                URL.createObjectURL(file);

            preview.style.display =
                "block";

            document.getElementById("verifyMessage").innerText =
                "📸 Photo captured! Ready for AI verification.";

        }


        // Verification placeholder
        function verifyDiscovery() {

            const photo =
                document.getElementById("photoInput").files[0];

            if (!photo) {

                document.getElementById("verifyMessage").innerText =
                    "📷 Please take a photo first.";

                return;
            }

            document.getElementById("verifyMessage").innerText =
                "🤖 Photo captured — AI vision verification will be connected next.";

        }

    </script>

</body>
</html>
