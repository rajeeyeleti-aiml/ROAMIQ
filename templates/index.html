<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ROAMIQ</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background: #eef7ee;
            padding: 40px 20px;
        }

        .container {
            max-width: 600px;
            margin: auto;
            background: white;
            padding: 35px;
            border-radius: 20px;
        }

        h1 {
            font-size: 42px;
            margin-bottom: 5px;
        }

        .tagline {
            font-size: 18px;
            margin-bottom: 35px;
        }

        button {
            padding: 15px 30px;
            font-size: 18px;
            border: none;
            border-radius: 30px;
            cursor: pointer;
        }

        #challenge {
            margin-top: 30px;
            font-size: 22px;
            line-height: 1.5;
        }

        #status {
            margin-top: 15px;
            font-size: 15px;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>🌿 ROAMIQ</h1>

        <p class="tagline">
            AI that gets you moving.
        </p>

        <button onclick="startRoamiq()">
            🎙️ Start ROAMIQ
        </button>

        <div id="challenge">
            Your outdoor challenge will appear here.
        </div>

        <div id="status"></div>

    </div>


    <script>

        async function startRoamiq() {

            document.getElementById("status").innerText =
                "Getting your challenge...";

            try {

                const response = await fetch("/challenge");

                const data = await response.json();

                const challenge = data.challenge;

                document.getElementById("challenge").innerText =
                    challenge;

                document.getElementById("status").innerText =
                    "🎧 Listen and explore your surroundings!";

                speak(challenge);

            } catch (error) {

                document.getElementById("status").innerText =
                    "Something went wrong. Please try again.";

                console.error(error);
            }
        }


        function speak(text) {

            const speech =
                new SpeechSynthesisUtterance(text);

            speech.lang = "en-US";
            speech.rate = 0.9;

            window.speechSynthesis.speak(speech);
        }

    </script>

</body>
</html>
